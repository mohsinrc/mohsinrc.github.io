# Basic Site Settings
locale                   : "en-US"
site_theme               : "sunrise"
title                    : "Mohsin Raza"
title_separator          : "-"
name                     : &name "Mohsin Raza"
description              : &description "PhD Student at CQuIC, University of New Mexico"
url                      : https://mohsinrc.github.io
baseurl                  : ""
repository               : "mohsinrc/mohsinrc.github.io"

# Site Author
author:
  avatar           : "profile.jpeg"
  name             : "Mohsin Raza"
  pronouns         :
  bio              : "PhD Student at the Center of Quantum Information and Control (CQuIC)"
  location         : "Albuquerque, NM, USA."
  employer         : "University of New Mexico"
  uri              :
  email            : 
  arxiv            : "https://arxiv.org/a/raza_m_1.html"
  googlescholar    : "https://scholar.google.com/citations?user=Q3pdMbUAAAAJ&hl=en"
  github           : "mohsinrc"   # fix: was set to "academicpages" (the template default)

# Site Settings
breadcrumbs              : false
words_per_minute         : 160
future                   : false
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false
atom_feed:
  hide                   : true    # hides RSS feed footer link

# SEO
google_site_verification : "0fYzNiowVEZUmgUUuQV3ScgtS068OYC6LvDWWeZdsd0"

# Analytics - disabled
analytics:
  provider               : "false"

# Reading Files
include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# NO collections defined at all — removes publications, talks, teaching, portfolio

# Page defaults — only pages, no posts or collections
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Minimal plugins only
plugins:
  - jekyll-sitemap

whitelist:
  - jekyll-sitemap

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development